[package]
name = "renegadebox-engine"
version = "0.1.0"
edition = "2024"
description = "RenegadeBox sync engine: end-to-end-encrypted folder sync into your own S3 bucket"
license = "MIT"

[[bin]]
name = "rbox"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
argon2 = "0.5"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.0"
aws-sdk-s3 = "1.152.0"
base64 = "0.22"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
hkdf = "0.12"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rand = "0.8"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
zeroize = { version = "1.9.1", features = ["derive"] }
