[package]
name = "renegadebox-desktop"
version = "0.1.0"
description = "RenegadeBox Desktop GUI Client"
edition = "2024"
license = "MIT"

[lib]
name = "renegadebox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
renegadebox-engine = { path = "../../engine" }
chrono = "0.4"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
